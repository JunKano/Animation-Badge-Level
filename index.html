const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(now){const dt=Math.min((now-last)/16.67,3);last=now;if(intro && !reduced){const t=Math.min((now-introStart)/1800,1);const eased=1-Math.pow(1-t,3);y=-18+720*eased;if(t===1)intro=false}else if(!drag){if(!reduced)vy+=(.18-vy)*.012*dt;else vy*=Math.pow(.96,dt);vx*=Math.pow(.94,dt);x+=vx*dt;x+=(5-x)*.012*dt;y+=vy*dt}badge.style.transform=`rotateX(${x}deg) rotateY(${y}deg)`;badge.style.setProperty('--shine',`${50+45*Math.sin(y*Math.PI/180)}%`);requestAnimationFrame(frame)}requestAnimationFrame(frame);
stage.addEventListener('pointerdown',e=>{intro=false;drag=true;lastX=e.clientX;lastY=e.clientY;vy=vx=0;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;y+=dx*.55;x=Math.max(-35,Math.min(35,x-dy*.3));vy=dx*.11;vx=-dy*.05;lastX=e.clientX;lastY=e.clientY});function release(){if(!drag)return;drag=false}stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);stage.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')y-=15;else if(e.key==='ArrowRight')y+=15;else return;e.preventDefault();intro=false});
</script></body></html>
